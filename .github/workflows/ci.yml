name: Verificación

# El repositorio no tenía verificación automática: `npm run check` sólo se ejecutaba a mano.
# Aquí corre en cada push y en cada Pull Request, sin secretos (la suite de fixtures no usa red).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipo, estilo, fixtures y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación (typecheck + lint + suite de atascos)
        run: npm run check

      - name: Compilación de producción
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
